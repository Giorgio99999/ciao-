.glass{
  background:linear-gradient(160deg, rgba(28,10,46,.92), rgba(10,4,18,.92));
  border:1px solid rgba(255,46,166,.28);
}

.card-hover{
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.card-hover:hover{
  transform:translateY(-4px);
  border-color:var(--pink);
  box-shadow:0 18px 44px rgba(255,46,166,.22), 0 0 0 1px rgba(255,46,166,.22);
}

@keyframes flicker{
  0%,100%{
    opacity:1
  }

  92%{
    opacity:1
  }

  93%{
    opacity:.55
  }

  94%{
    opacity:1
  }

  96%{
    opacity:.7
  }

  97%{
    opacity:1
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-10px)
  }
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 18px rgba(255,46,166,.45)
  }

  50%{
    box-shadow:0 0 34px rgba(0,234,255,.55)
  }
}

.flicker{
  animation:flicker 4.2s infinite;
}

.floaty{
  animation:floaty 5s ease-in-out infinite;
}

.marquee-track{
  animation:marquee 22s linear infinite;
  white-space:nowrap;
}

.pulse-glow{
  animation:pulseGlow 2.8s ease-in-out infinite;
}

input,select,textarea{
  color:var(--text);
}

input::-moz-placeholder, textarea::-moz-placeholder{
  color:#9b82ad;
}

input::placeholder,textarea::placeholder{
  color:#9b82ad;
}

.field{
  width:100%;
  background:#0a0412;
  border:1px solid #43205f;
  border-radius:12px;
  padding:11px 13px;
  font-size:16px;
  outline:none;
}

.field:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,234,255,.18);
}

.btn-primary{
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:white;
  border-radius:999px;
  padding:12px 20px;
  font-weight:800;
  letter-spacing:.04em;
  box-shadow:0 10px 28px rgba(255,46,166,.35);
  transition:.2s;
}

.btn-primary:hover{
  filter:brightness(1.12);
  transform:translateY(-1px);
}

.btn-primary:disabled{
  opacity:.55;
  transform:none;
}

.btn-ghost{
  border:1px solid var(--cyan);
  color:var(--cyan);
  border-radius:999px;
  padding:11px 18px;
  font-weight:800;
  background:rgba(0,234,255,.06);
  transition:.2s;
}

.btn-ghost:hover{
  background:rgba(0,234,255,.16);
}

.chip{
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  padding:5px 10px;
  font-size:13px;
  font-weight:700;
}

::-webkit-scrollbar{
  width:10px;
  height:8px;
}

::-webkit-scrollbar-thumb{
  background:#4a2369;
  border-radius:99px;
}

::-webkit-scrollbar-track{
  background:#0a0412;
}

.hover\:bg-white\/10:hover{
  background-color: rgb(255 255 255 / 0.1);
}

.hover\:text-\[\#00eaff\]:hover{
  --tw-text-opacity: 1;
  color: rgb(0 234 255 / var(--tw-text-opacity, 1));
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

@media (min-width: 640px){
  .sm\:left-4{
    left: 1rem;
  }

  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:w-auto{
    width: auto;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:gap-2{
    gap: 0.5rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-3{
    padding-left: 0.75rem;
    padding-right: 0.75rem;
  }

  .sm\:py-16{
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:pb-16{
    padding-bottom: 4rem;
  }

  .sm\:pt-16{
    padding-top: 4rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:col-span-3{
    grid-column: span 3 / span 3;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[0\.8fr_1\.2fr\]{
    grid-template-columns: 0.8fr 1.2fr;
  }

  .lg\:grid-cols-\[0\.9fr_1\.1fr\]{
    grid-template-columns: 0.9fr 1.1fr;
  }

  .lg\:grid-cols-\[1\.15fr_\.85fr\]{
    grid-template-columns: 1.15fr .85fr;
  }

  .lg\:grid-cols-\[1\.5fr_\.8fr\]{
    grid-template-columns: 1.5fr .8fr;
  }

  .lg\:grid-cols-\[1fr_1\.2fr\]{
    grid-template-columns: 1fr 1.2fr;
  }
}
